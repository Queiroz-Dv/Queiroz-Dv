name: Atualizar métricas do GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

jobs:
  github-metrics:
    name: Gerar infográfico do perfil
    runs-on: ubuntu-latest

    steps:
      - name: Gerar métricas personalizadas
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.GH_TOKEN }}
          committer_token: ${{ github.token }}
          user: Queiroz-Dv
          filename: github-metrics.svg
          template: classic
          base: header, activity, community
          config_timezone: America/Sao_Paulo

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_categories: programming, markup
          plugin_languages_sections: most-used
          plugin_languages_threshold: 2%
