name: Atualizar métricas do GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: write

jobs:
  github-metrics:
    name: Gerar infográfico do perfil
    runs-on: ubuntu-latest

    steps:
      - name: Gerar métricas personalizadas
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.GH_TOKEN }}
          committer_token: ${{ github.token }}
          user: Queiroz-Dv
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_categories: programming, markup
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          plugin_lines: yes
